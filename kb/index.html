<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111418"><title>KB Bootstrap</title><style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#20242a;--text:#f3f5f7;--muted:#aab1bb;--accent:#d9ff63;--line:#303640}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}.app{max-width:620px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.04em}.muted{color:var(--muted)}.pill{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.hero{background:#171a1f;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800}.hero h1{font-size:28px;line-height:1.08;margin:8px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;background:var(--accent);color:#111;margin-top:14px}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.small{width:auto;margin:0;padding:9px 11px;font-size:13px}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.exhead{display:flex;gap:12px}.check{width:28px;height:28px;border-radius:9px;border:2px solid #68717d;background:transparent;color:#111;flex:none}.check.done{background:var(--accent);border-color:var(--accent)}.exbody{flex:1}.exname{font-weight:800;font-size:17px}.prescription{color:var(--muted);font-size:14px;margin-top:3px}.controls{display:flex;gap:8px;align-items:center;margin-top:12px}.weight{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}.weight button{border:0;background:transparent;color:var(--text);width:38px;height:40px;font-weight:900}.weight input{width:58px;height:40px;background:transparent;border:0;color:var(--text);text-align:center;font-weight:800}.video{margin-left:auto;color:var(--accent);text-decoration:none;font-size:13px;font-weight:800;padding:10px}.sectionTitle{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:20px 3px 8px}.timer{position:sticky;bottom:10px;background:#0b0d0fee;border:1px solid var(--line);border-radius:18px;padding:12px;display:none;z-index:5}.timer.show{display:flex;align-items:center;gap:10px}.clock{font-size:25px;font-variant-numeric:tabular-nums;font-weight:900;min-width:78px}.timerInfo{flex:1;font-size:13px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.historyItem{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}details{margin-top:18px}.settings{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}.sessionSelect{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.doneText{text-decoration:line-through;opacity:.55}.footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}.learn{border-left:3px solid var(--accent)}
</style></head><body><main class="app"><div class="top"><div class="brand">KB BOOTSTRAP</div><div class="pill" id="progressPill"></div></div><section id="hero" class="hero"></section><div id="exercises"></div><div class="nav"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn secondary" id="nextBtn">Next →</button></div><div class="sectionTitle">Completed workouts</div><div id="history"></div><details><summary class="muted">Settings & backup</summary><div class="settings"><label class="muted">Jump to session</label><select id="sessionSelect" class="sessionSelect"></select><button class="btn secondary" id="exportBtn">Export progress JSON</button><button class="btn secondary" id="importBtn">Import progress JSON</button><input id="importFile" type="file" accept="application/json" hidden><button class="btn secondary" id="resetBtn">Reset app data</button></div></details><div class="footer">Program data transcribed from the Wildman Kettlebell Bootstrap spreadsheet. Training data stays on this device unless exported.</div><div class="timer" id="timer"><div class="clock" id="clock">01:00</div><div class="timerInfo"><b id="timerName">EMOM</b><br><span class="muted" id="timerRound"></span></div><button class="btn small" id="timerToggle">Start</button><button class="btn small secondary" id="timerClose">×</button></div></main><script>
const U='https://www.youtube.com/watch?v=';const P='&list=PLk4oYPJ7TXKhX8YqA2AVrfgs_pEF6p7KA&index=';const V={1:['x0XkmM34BPI',1],2:['m-S9H2XVvYg',2],3:['XaegZzSbtr0',3],4:['25xdtjbFPtw',4],5:['TwlQQXAQpaQ',5],6:['GrRO00YOIWM',6],7:['SMpquy5zSL4',7],8:['eMkDP9VmMc0',8],9:['ejPpyLKZ1L4',9],10:['0Uk0Rdm3QFs',10],11:['cQC2y-ByaAw',11],12:['_nIsSXWs5iU',12],13:['6TVqHl2gtuM',13],14:['XHkI03S6Pls',14],15:['htByOXjHLXE',15],16:['XbK3jxI0WNQ',16],17:['SSxB3m5qRas',17],18:['5Q4vMOYvAGg',18],19:['dSj3kqbuois',19],20:['k5Bc7pkEmrU',20],21:['Aik5-BStbnc',21],22:['cnZ8Mx8NQPE',22],23:['KTDVl0Lkdc4',23]};const N={1:'Two Hand Deadlift',2:'Two Hand Swing',3:'Around the World',4:'Halo',5:'Around the World Front to Back',6:'Around the World Back to Front',7:'Alternating Halo',8:'Two Hand Pickup One Hand Putdown',9:'Single Arm Swing',10:'Hand to Hand Transition',11:'Two Hand Pickup Clean Putdown',12:'Swing Clean',13:'Clean with Hand Transition',14:'Single Arm Overhead Press',15:'Newspaper drill',16:'Start Stop Clean',17:'Clean & Press',18:'Clean & Press with Hand Transition',19:'Start Stop Clean & Press',20:'Bottoms-Up Goblet Box Squat',21:'Goblet Box Squat with Halo',22:'Goblet Squat with Halo',23:'Single-Bell Front Squat'};const e=(id,m,s,r,t)=>({id:'KB-'+String(id).padStart(2,'0'),name:N[id],modality:m,sets:s,reps:r,totalReps:t,url:U+V[id][0]+P+V[id][1]});const learn=ids=>ids.map(id=>e(id,'Learn',null,null,null));
const SESSIONS=[
{session:1,level:1,summary:'Perform drills to learn',title:'Session 1 – Intro to Level 1',exercises:learn([1,2,3,4,5,6,7])},
{session:2,level:1,summary:'Warmup & Swing',title:'Session 2 – Level 1 #1',totalReps:180,exercises:[e(1,'Warmup',2,10,20),e(3,'Warmup',2,'20/20',80),e(4,'Warmup',2,'5/5',20),e(2,'EMOM',10,6,60)]},
{session:3,level:1,summary:'Warmup & Swing',title:'Session 3 – Level 1 #2',totalReps:226,exercises:[e(1,'Warmup',2,10,20),e(3,'Warmup',2,'20/20',80),e(7,'Warmup',2,'5/5',20),e(5,'Warmup',2,'10/10',40),e(2,'EMOM',11,6,66)]},
{session:4,level:2,summary:'Perform drills to learn',title:'Session 4 – Intro to Level 2',exercises:learn([8,9,10,11,12,13,14])},
{session:5,level:1,summary:'Warmup & Swing',title:'Session 5 – Level 1 #3',totalReps:232,exercises:[e(1,'Warmup',2,10,20),e(3,'Warmup',2,'20/20',80),e(4,'Warmup',2,'5/5',20),e(6,'Warmup',2,'10/10',40),e(2,'EMOM',12,6,72)]},
{session:6,level:2,summary:'Clean, Press',title:'Session 6 – Level 2 #1',totalReps:246,exercises:[e(3,'Warmup',2,'10/10',40),e(4,'Warmup',2,'5/5',20),e(8,'Warmup',1,'5/5',10),e(11,'Warmup',1,'5/5',10),e(5,'Warmup',2,'10/10',40),e(12,'EMOM',10,'6/6',120),e(14,'Volume',1,'3/3',6)]},
{session:7,level:1,summary:'Warmup & Swing',title:'Session 7 – Level 1 #4',totalReps:252,exercises:[e(1,'Warmup',2,10,20),e(3,'Warmup',2,'10/10',40),e(4,'Warmup',2,'5/5',20),e(5,'Warmup',2,'10/10',40),e(7,'Warmup',2,'5/5',20),e(6,'Warmup',2,'10/10',40),e(2,'EMOM',12,6,72)]},
{session:8,level:2,summary:'Clean, Press',title:'Session 8 – Level 2 #2',totalReps:252,exercises:[e(3,'Warmup',2,'10/10',40),e(7,'Warmup',2,'5/5',20),e(8,'Warmup',1,'5/5',10),e(11,'Warmup',1,'5/5',10),e(6,'Warmup',2,'10/10',40),e(13,'EMOM',10,'6/6',120),e(14,'Volume',2,'3/3',12)]},
{session:9,level:3,summary:'Squat, Clean & Press',title:'Session 9 – Intro to Level 3',exercises:learn([15,16,17,18,19,20,21,22,23])}];
const KEY='kbBootstrap.v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{current:1,completed:{},weights:{},checks:{}};let timer={running:false,left:60,round:1,total:0,id:null,name:''};const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),current=()=>SESSIONS.find(s=>s.session===state.current)||SESSIONS[0];function rx(e){if(e.modality==='Learn')return'Learn / practise';return `${e.modality||'Work'} · ${e.sets??'—'} set${e.sets==1?'':'s'} × ${e.reps??'—'} reps`}
function render(){const s=current();$('#progressPill').textContent=`Session ${s.session} of ${SESSIONS.length}`;$('#hero').innerHTML=`<div class="eyebrow">Level ${s.level}</div><h1>${s.summary}</h1><div class="muted">${s.title}</div><div class="meta">${s.totalReps?`<span class="pill">${s.totalReps} total reps</span>`:''}<span class="pill">${s.exercises.length} movements</span></div><button class="btn" id="completeBtn">${state.completed[s.session]?'Completed ✓':'Complete workout'}</button>`;$('#completeBtn').onclick=()=>{if(state.completed[s.session])delete state.completed[s.session];else{state.completed[s.session]=new Date().toISOString();if(s.session<SESSIONS.length)state.current=s.session+1}save();render()};$('#exercises').innerHTML=s.exercises.map((x,i)=>{let ck=!!state.checks[`${s.session}-${i}`],w=state.weights[x.id]??8;return `<div class="exercise ${x.modality==='Learn'?'learn':''}"><div class="exhead"><button class="check ${ck?'done':''}" data-check="${i}">${ck?'✓':''}</button><div class="exbody ${ck?'doneText':''}"><div class="exname">${x.name}</div><div class="prescription">${rx(x)}${x.totalReps?` · ${x.totalReps} total`:''}</div></div></div><div class="controls"><div class="weight"><button data-w="${x.id}" data-d="-1">−</button><input inputmode="numeric" data-input="${x.id}" value="${w}"><button data-w="${x.id}" data-d="1">+</button></div><span class="muted">kg</span>${x.modality==='EMOM'?`<button class="btn small secondary" data-timer="${i}">Timer</button>`:''}<a class="video" href="${x.url}" target="_blank" rel="noopener">Tutorial ↗</a></div></div>`}).join('');document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let k=`${s.session}-${b.dataset.check}`;state.checks[k]=!state.checks[k];save();render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{let id=b.dataset.w,v=Number(state.weights[id]??8)+Number(b.dataset.d)*2;state.weights[id]=Math.max(0,Math.min(60,v));save();render()});document.querySelectorAll('[data-input]').forEach(i=>i.onchange=()=>{state.weights[i.dataset.input]=Math.max(0,Number(i.value)||0);save()});document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>startTimerFor(s.exercises[Number(b.dataset.timer)]));$('#prevBtn').disabled=s.session===1;$('#nextBtn').disabled=s.session===SESSIONS.length;$('#prevBtn').onclick=()=>{state.current=Math.max(1,s.session-1);save();render()};$('#nextBtn').onclick=()=>{state.current=Math.min(SESSIONS.length,s.session+1);save();render()};$('#sessionSelect').value=String(s.session);renderHistory()}
function renderHistory(){let a=Object.entries(state.completed).sort((a,b)=>b[0]-a[0]);$('#history').innerHTML=a.length?a.map(([n,d])=>`<div class="historyItem"><span><b>Session ${n}</b> · ${SESSIONS[n-1]?.summary||''}</span><span class="muted">${new Date(d).toLocaleDateString()}</span></div>`).join(''):'<div class="muted">No completed workouts yet.</div>'}function startTimerFor(x){timer.running=false;clearInterval(timer.id);timer.left=60;timer.round=1;timer.total=Number(x.sets)||10;timer.name=x.name;$('#timer').classList.add('show');updateTimer();$('#timerToggle').textContent='Start'}function updateTimer(){$('#clock').textContent=`00:${String(timer.left).padStart(2,'0')}`;$('#timerName').textContent=timer.name||'EMOM';$('#timerRound').textContent=`Round ${timer.round} of ${timer.total}`}function toggleTimer(){if(timer.running){timer.running=false;clearInterval(timer.id);$('#timerToggle').textContent='Resume';return}timer.running=true;$('#timerToggle').textContent='Pause';timer.id=setInterval(()=>{timer.left--;if(timer.left<=0){if(timer.round>=timer.total){clearInterval(timer.id);timer.running=false;timer.left=0;$('#timerToggle').textContent='Done';navigator.vibrate?.([100,80,100]);updateTimer();return}timer.round++;timer.left=60;navigator.vibrate?.(120)}updateTimer()},1000)}
$('#timerToggle').onclick=toggleTimer;$('#timerClose').onclick=()=>{clearInterval(timer.id);timer.running=false;$('#timer').classList.remove('show')};SESSIONS.forEach(s=>$('#sessionSelect').insertAdjacentHTML('beforeend',`<option value="${s.session}">Session ${s.session} — ${s.summary}</option>`));$('#sessionSelect').onchange=x=>{state.current=Number(x.target.value);save();render()};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kb-bootstrap-progress.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async x=>{try{let y=JSON.parse(await x.target.files[0].text());if(!y||typeof y.current!=='number')throw 0;state=y;save();render()}catch{alert('That does not look like a KB Bootstrap backup file.')}};$('#resetBtn').onclick=()=>{if(confirm('Reset all workout progress and saved weights?')){localStorage.removeItem(KEY);state={current:1,completed:{},weights:{},checks:{}};render()}};render();
</script></body></html>
